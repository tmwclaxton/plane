name: Production Deploy

on:
  workflow_dispatch:
  push:
    branches: [lgs/bulk-due-dates]

concurrency:
  group: plane-production-deploy
  cancel-in-progress: false

env:
  DEPLOY_HOST: admin.grantgunner.org
  DEPLOY_USER: gunnergrant
  DEPLOY_DIR: /home/gunnergrant/plane-selfhost/plane-app

jobs:
  deploy:
    name: Deploy overlay to plane.canvassr.org
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL --output /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config << EOF
          Host ${{ env.DEPLOY_HOST }}
            User ${{ env.DEPLOY_USER }}
            IdentityFile ~/.ssh/deploy_key
            BatchMode yes
            ConnectTimeout 30
            ServerAliveInterval 30
            ServerAliveCountMax 6
            StrictHostKeyChecking accept-new
            ProxyCommand cloudflared access ssh --hostname %h
          EOF

      - name: Sync overlay and rebuild
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          ssh ${{ env.DEPLOY_HOST }} "mkdir -p ${{ env.DEPLOY_DIR }}/og ${{ env.DEPLOY_DIR }}/public-frontend"
          rsync -a --delete \
            --exclude '.git' \
            deploy/og/ ${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_DIR }}/og/
          rsync -a --delete \
            --exclude '.git' \
            deploy/public-frontend/ ${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_DIR }}/public-frontend/
          scp deploy/prod-deploy.sh ${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_DIR }}/prod-deploy.sh
          ssh ${{ env.DEPLOY_HOST }} "chmod +x ${{ env.DEPLOY_DIR }}/prod-deploy.sh && ${{ env.DEPLOY_DIR }}/prod-deploy.sh"
